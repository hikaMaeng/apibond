name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: node scripts/check-deployments.mjs
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: node --test scripts/install.test.mjs
  mac-deployment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            binary: deploy/v0.1.0/darwin-arm64/apibond
          - os: macos-15-intel
            binary: deploy/v0.1.0/darwin-x64/apibond
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke-deployment.mjs '${{ matrix.binary }}'
