[package]
name = "apibond"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A thin session-affine native API bonding proxy for OpenAI and Anthropic"
license = "MIT"
repository = "https://github.com/hikaMaeng/apibond"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio", "json"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
bytes = "=1.12.1"
futures-util = "=0.3.34"
async-stream = "=0.3.6"
parking_lot = "=0.13.0"
sha2 = "=0.11.1"
subtle = "=2.6.1"
lru = { version = "=0.19.0", default-features = false }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
clap = { version = "=4.6.7", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

